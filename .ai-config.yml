# AI-Ready Repository System Configuration
# Version: 2.1.0
# Project: GOBY — Alpha Consulting Solutions S.L.

project:
  name: "GOBY"
  description: "Metodología propietaria de adopción de IA para empresas B2B medianas y grandes. 13 herramientas (T1-T13), 5 arquetipos de stakeholder, sprint 6 meses."
  status: "development"  # development | early-adopters | production
  language: "es"         # idioma docs humanas

ai:
  system_version: "2.1.0"
  installed: "2026-06-01"
  last_setup: "2026-06-01"

team:
  profile: "technical"   # Carlos: técnico pero sin CLI (D5)
  size: "solo"           # 1 desarrollador humano + Claude como co-arquitecto
  no_cli: true           # Carlos NO usa terminal — ver ADR-005

validation:
  level: "A"             # A (básico) | B (intermedio) | C (avanzado)
  blocking: true
  changelog_required: true
  adr_required_for: ["stack", "schema", "security", "architecture", "infrastructure", "dependencies"]
  fdr_required_for: ["user-behavior", "roles", "workflows", "modules", "product-decisions"]

branches:
  main_branch: "main"
  protected:
    - "main"
    - "develop"
  environments:
    - branch: "main"
      label: "PRO"
      url: "https://gobytech-prod.vercel.app/"
      auto_deploy: true
    - branch: "develop"
      label: "PRE"
      url: "https://v0-lean-ai-system.vercel.app/"
      auto_deploy: true
    - branch: "local"
      label: "DEV"
      url: "localhost:5173"
      auto_deploy: false
  naming:
    feature: "feature-"
    refactor: "refactor-"
    fix_minor: "fix-"
    fix_critical: "fix-critical-"
  merge_rules:
    develop:
      required_approvals: 1
      required_checks: ["ci", "validate-docs"]
    main:
      required_approvals: 1
      required_checks: ["ci", "validate-docs"]
    fix_critical_to_main:
      required_approvals: 1
      required_checks: ["ci"]
      backport_to_develop: true

environments:
  - name: "production"
    branch: "main"
    supabase_project: "vbpgsgxsslccctjhuegt"
    supabase_url: "https://vbpgsgxsslccctjhuegt.supabase.co"
  - name: "staging"
    branch: "develop"
    supabase_project: "mkypmakmkxpecuezofkk"
    supabase_url: "https://mkypmakmkxpecuezofkk.supabase.co"
  - name: "local"
    branch: "any"
    supabase_project: "local"
    supabase_url: "http://127.0.0.1:54321"

critical_areas:
  - path: "supabase/migrations/"
    reason: "Las migraciones de base de datos son irreversibles"
  - path: "src/lib/supabase.ts"
    reason: "Punto único de conexión a Supabase — cambios afectan a todo el sistema"
  - path: "supabase/functions/"
    reason: "Edge Functions con lógica de IA y permisos de usuario"
  - path: "supabase/policies/"
    reason: "Row Level Security — cambios pueden exponer datos entre tenants"
  - path: "src/stores/"
    reason: "Estado global — cambios afectan a múltiples módulos"

security_watch:
  - "@supabase/supabase-js"
  - "@supabase/auth-helpers-react"
  - "react"
  - "vite"
  - "xlsx"

infrastructure:
  cloud_services:
    - name: "Vercel"
      purpose: "hosting + preview deployments automáticos por PR"
      environments: ["PRO", "PRE"]
    - name: "Supabase"
      purpose: "PostgreSQL + Auth + Storage + Realtime + Edge Functions"
      environments: ["PRO", "PRE", "DEV"]
    - name: "Claude API (Anthropic)"
      purpose: "Recomendaciones IA en T6 y Edge Function ai-recommend"
      environments: ["PRO", "PRE"]
  vps:
    enabled: false

databases:
  system: "supabase"
  per_environment: true
  migration_folder: "supabase/migrations/"
  environments:
    - label: "PRO"
      vars_prefix: "VITE_SUPABASE"
      project_name: "vbpgsgxsslccctjhuegt"
      url: "https://vbpgsgxsslccctjhuegt.supabase.co"
    - label: "PRE"
      vars_prefix: "VITE_SUPABASE"
      project_name: "mkypmakmkxpecuezofkk"
      url: "https://mkypmakmkxpecuezofkk.supabase.co"
    - label: "DEV"
      local: true
      vars_prefix: "VITE_SUPABASE"
      url: "http://127.0.0.1:54321"

claude_md:
  extra_rules:
    - "Carlos no usa CLI. Todas las instrucciones para Carlos deben ser via GitHub web o Vercel Dashboard."
    - "Las migraciones SQL se ejecutan manualmente en Supabase SQL Editor — nunca via CLI."
    - "El CLAUDE.md existente define el rol estratégico del producto; este sistema define el protocolo técnico."
  blocked_patterns:
    - "import { createClient } from '@supabase/supabase-js'  # usar src/lib/supabase.ts"
    - "any en interfaces de base de datos"
    - "SELECT * en tablas grandes sin WHERE acotado"
    - "console.log con datos de usuario"
