name: GOBY — CI/CD Core Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # JOB 1: Validaciones de Código, Tipado y Tests Unitarios
  # ----------------------------------------------------
  ci:
    name: TypeScript + Unit Tests + Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Upgraded to v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verification — Linter
        run: npm run lint
        continue-on-error: false

      - name: Verification — ADR-021 Design System (gray→warm migration)
        # continue-on-error: true → TRANSITORIO hasta que Fase 2 de ADR-021 esté completa.
        # Cambiar a false (o eliminar la línea) cuando lint:design devuelva 0 violaciones.
        run: npm run lint:design
        continue-on-error: true

      - name: Verification — TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit Tests (Vitest)
        run: npm run test
        env:
          NODE_ENV: test
          VITE_SUPABASE_URL: https://placeholder-ci-test.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder-ci-test

      - name: Production Build Verification
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL_PRE || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PRE || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}

  # ----------------------------------------------------
  # JOB 2: Despliegue de Supabase Edge Functions
  # ----------------------------------------------------
  deploy-functions:
    name: Deploy Supabase Edge Functions (PRE)
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions to PRE
        run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ----------------------------------------------------
  # JOB 3: Pruebas de Integración de Extremo a Extremo (E2E)
  # ----------------------------------------------------
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [ci, deploy-functions]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    env:
      E2E_BASE_URL:               ${{ secrets.VERCEL_PREVIEW_URL_DEVELOP }}
      VITE_SUPABASE_URL:          ${{ secrets.SUPABASE_URL_PRE }}
      VITE_SUPABASE_ANON_KEY:     ${{ secrets.SUPABASE_ANON_KEY_PRE }}
      E2E_EMAIL:                  ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD:               ${{ secrets.E2E_PASSWORD }}
      E2E_SUPERADMIN_EMAIL:       ${{ secrets.E2E_SUPERADMIN_EMAIL }}
      E2E_SUPERADMIN_PASSWORD:    ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
      E2E_CONSULTANT_EMAIL:       ${{ secrets.E2E_CONSULTANT_EMAIL }}
      E2E_CONSULTANT_PASSWORD:    ${{ secrets.E2E_CONSULTANT_PASSWORD }}
      E2E_CLIENT_EDITOR_EMAIL:    ${{ secrets.E2E_CLIENT_EDITOR_EMAIL }}
      E2E_CLIENT_EDITOR_PASSWORD: ${{ secrets.E2E_CLIENT_EDITOR_PASSWORD }}
      E2E_CLIENT_VIEWER_EMAIL:    ${{ secrets.E2E_CLIENT_VIEWER_EMAIL }}
      E2E_CLIENT_VIEWER_PASSWORD: ${{ secrets.E2E_CLIENT_VIEWER_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Upgraded to v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npx playwright test

      # 📦 Persistencia: Si algún test E2E falla, guardamos el reporte para depuración
      - name: Upload Playwright Test Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7