name: GOBY — CI/CD Core Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  # ----------------------------------------------------
  # JOB 1: Validaciones de Código, Tipado y Tests Unitarios
  # ----------------------------------------------------
  ci:
    name: TypeScript + Unit Tests + Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Upgraded to v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verification — Linter
        run: npm run lint
        continue-on-error: false

      - name: Verification — TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit Tests (Vitest)
        run: npm run test
        env:
          NODE_ENV: test

      - name: Production Build Verification
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL_PRE || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PRE || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}

  # ----------------------------------------------------
  # JOB 2: Pruebas de Integración de Extremo a Extremo (E2E)
  # ----------------------------------------------------
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: ci
    # 🛡️ Seguridad: Bloqueamos la ejecución de E2E en main (PRO) para proteger datos reales de producción
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Upgraded to v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # 🔄 Entorno Local/PR: Si NO estamos en develop, levantamos el servidor dev local
      - name: Start Local Dev Server (Feature Branches / PRs only)
        if: github.ref != 'refs/heads/develop'
        run: npm run dev &

      - name: Run Playwright E2E Tests
        run: npx playwright test
        env:
          # 🚀 URL DINÁMICA: Si es develop apunta a la URL estable de la rama PRE en Vercel; si es PR local, a localhost
          E2E_BASE_URL: ${{ github.ref == 'refs/heads/develop' && 'https://gobytech-prod-git-develop-carlos-projects-52e64d02.vercel.app/' || 'http://localhost:5173' }}

          # 🗄️ BASE DE DATOS DINÁMICA: develop ataca a PRE real; las ramas locales usan el contenedor local
          VITE_SUPABASE_URL: ${{ github.ref == 'refs/heads/develop' && secrets.SUPABASE_URL_PRE || 'http://127.0.0.1:54321' }}
          VITE_SUPABASE_ANON_KEY: ${{ github.ref == 'refs/heads/develop' && secrets.SUPABASE_ANON_KEY_PRE || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.localplaceholder' }}

          # Inyección de credenciales de laboratorio desde los Secretos de GitHub
          E2E_EMAIL:                  ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD:               ${{ secrets.E2E_PASSWORD }}
          E2E_SUPERADMIN_EMAIL:       ${{ secrets.E2E_SUPERADMIN_EMAIL }}
          E2E_SUPERADMIN_PASSWORD:    ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
          E2E_CONSULTANT_EMAIL:       ${{ secrets.E2E_CONSULTANT_EMAIL }}
          E2E_CONSULTANT_PASSWORD:    ${{ secrets.E2E_CONSULTANT_PASSWORD }}
          E2E_CLIENT_EDITOR_EMAIL:    ${{ secrets.E2E_CLIENT_EDITOR_EMAIL }}
          E2E_CLIENT_EDITOR_PASSWORD: ${{ secrets.E2E_CLIENT_EDITOR_PASSWORD }}
          E2E_CLIENT_VIEWER_EMAIL:    ${{ secrets.E2E_CLIENT_VIEWER_EMAIL }}
          E2E_CLIENT_VIEWER_PASSWORD: ${{ secrets.E2E_CLIENT_VIEWER_PASSWORD }}

      # 📦 Persistencia: Si algún test E2E falla, guardamos el reporte para depuración
      - name: Upload Playwright Test Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7