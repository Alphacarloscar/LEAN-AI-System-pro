name: CI — TypeScript + Tests + Build

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  ci:
    name: TypeScript + Unit Tests + Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint check
        run: npm run lint
        continue-on-error: false

      - name: Unit + Service tests
        run: npm run test
        env:
          # Vitest usa import.meta.env → en tests está mockeado, pero Vite
          # necesita estas vars para no lanzar error en módulos no mockeados
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

      - name: Production build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
          VITE_DEMO_ENABLED: 'true'
        run: npm run build

      - name: Build size check
        run: |
          echo "Build output:"
          ls -lh dist/assets/ | sort -k5 -rh | head -20
          total=$(du -sh dist/ | cut -f1)
          echo "Total dist size: $total"

      - name: Summary
        if: success()
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "  ✅ CI passed"
          echo "  GOBY — Alpha Consulting"
          echo "═══════════════════════════════════════════════════"
          echo "  TypeScript:  ✓ (0 errors)"
          echo "  Lint:        ✓ (0 warnings)"
          echo "  Tests:       ✓ (unit + service)"
          echo "  Build:       ✓ (production bundle OK)"
          echo "═══════════════════════════════════════════════════"

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          # Base URL para el webServer de Playwright (arranca npm run dev)
          E2E_BASE_URL: http://localhost:5173
          # Credenciales E2E — configurar en GitHub Actions secrets
          # Si no se proporcionan, los tests saltan con test.skip(!DEV_PASSWORD, ...)
          E2E_EMAIL:                  ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD:               ${{ secrets.E2E_PASSWORD }}
          E2E_SUPERADMIN_EMAIL:       ${{ secrets.E2E_SUPERADMIN_EMAIL }}
          E2E_SUPERADMIN_PASSWORD:    ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
          E2E_CONSULTANT_EMAIL:       ${{ secrets.E2E_CONSULTANT_EMAIL }}
          E2E_CONSULTANT_PASSWORD:    ${{ secrets.E2E_CONSULTANT_PASSWORD }}
          E2E_CLIENT_EDITOR_EMAIL:    ${{ secrets.E2E_CLIENT_EDITOR_EMAIL }}
          E2E_CLIENT_EDITOR_PASSWORD: ${{ secrets.E2E_CLIENT_EDITOR_PASSWORD }}
          E2E_CLIENT_VIEWER_EMAIL:    ${{ secrets.E2E_CLIENT_VIEWER_EMAIL }}
          E2E_CLIENT_VIEWER_PASSWORD: ${{ secrets.E2E_CLIENT_VIEWER_PASSWORD }}
          # Supabase vars necesarias para que la app arranque sin errores de módulo
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
          VITE_DEMO_ENABLED: 'false'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
