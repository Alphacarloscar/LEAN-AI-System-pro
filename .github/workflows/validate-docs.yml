name: Validate Documentation (AI-Ready System)

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate-docs:
    name: Documentation Validation — Level A
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────────
      # NIVEL A — SIEMPRE ACTIVO (bloqueante)
      # ─────────────────────────────────────────────────

      - name: "A1 | Core files exist"
        run: |
          echo "Checking required AI-Ready core files..."
          missing=()
          required=(
            "CLAUDE.md"
            ".ai-config.yml"
            "CHANGELOG.md"
            "docs/decisions/README.md"
            "docs/decisions/technical/ADR-000-template.md"
            "docs/decisions/functional/FDR-000-template.md"
            "docs/architecture/OVERVIEW.md"
            "docs/operations/BRANCHING.md"
            "docs/operations/ENVIRONMENTS.md"
            "docs/operations/DATABASES.md"
            ".github/PULL_REQUEST_TEMPLATE.md"
          )
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              missing+=("$f")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ Missing required AI-Ready files:"
            printf '  - %s\n' "${missing[@]}"
            echo ""
            echo "These files are required by the AI-Ready System v2.1.0."
            echo "Run the ai-repo-setup skill to generate them."
            exit 1
          fi
          echo "✅ All core files present"

      - name: "A2 | CHANGELOG updated with code changes"
        run: |
          echo "Checking CHANGELOG.md was updated..."
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          if echo "$changed" | grep -qE "^src/"; then
            if ! echo "$changed" | grep -q "^CHANGELOG.md"; then
              echo "❌ CHANGELOG.md must be updated when changing application code (src/)"
              echo ""
              echo "Changed code files:"
              echo "$changed" | grep "^src/" | head -15
              echo ""
              echo "Add an entry under [Unreleased] in CHANGELOG.md describing this change."
              exit 1
            fi
            echo "✅ CHANGELOG.md updated alongside code changes"
          else
            echo "✅ No src/ changes — CHANGELOG not required for this PR"
          fi

      - name: "A3 | ADR required for architectural changes"
        run: |
          echo "Checking if architectural changes have an ADR..."
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          arch_patterns=(
            "package.json"
            "supabase/migrations/"
            "supabase/functions/"
            "vercel.json"
            "vite.config.ts"
            "tsconfig.json"
            "tailwind.config"
          )

          has_arch_change=false
          for pattern in "${arch_patterns[@]}"; do
            if echo "$changed" | grep -q "$pattern"; then
              has_arch_change=true
              echo "  Architectural change detected: $pattern"
            fi
          done

          if $has_arch_change; then
            if ! echo "$changed" | grep -qE "^docs/decisions/"; then
              echo ""
              echo "❌ Architectural changes require an ADR (Architecture Decision Record)"
              echo ""
              echo "Create or update an ADR in docs/decisions/technical/"
              echo "Use ADR-000-template.md as starting point."
              echo "Next available: check docs/decisions/README.md"
              exit 1
            fi
            echo "✅ ADR found for architectural change"
          else
            echo "✅ No architectural changes — ADR not required"
          fi

      - name: "A4 | PR description minimum length"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ] || [ ${#PR_BODY} -lt 50 ]; then
            echo "❌ Pull request description is too short (minimum 50 characters)"
            echo "   Current length: ${#PR_BODY} characters"
            echo ""
            echo "Describe what this PR does and why. Use the PR template sections."
            exit 1
          fi
          echo "✅ PR description present (${#PR_BODY} characters)"

      - name: "A5 | No Supabase direct imports outside lib/"
        run: |
          echo "Checking for direct Supabase imports outside src/lib/..."
          violations=$(grep -r "from '@supabase/supabase-js'" src/ \
            --include="*.ts" --include="*.tsx" \
            | grep -v "src/lib/supabase.ts" \
            | grep -v "src/lib/supabase" || true)
          if [ -n "$violations" ]; then
            echo "❌ Direct @supabase/supabase-js imports found outside src/lib/:"
            echo "$violations"
            echo ""
            echo "All Supabase access must go through src/lib/supabase.ts (ADR-002)"
            exit 1
          fi
          echo "✅ No direct Supabase imports outside src/lib/"

      # ─────────────────────────────────────────────────
      # NIVEL B — Descomentar cuando el equipo esté listo
      # ─────────────────────────────────────────────────

      # - name: "B1 | Validate ADR structure"
      #   run: |
      #     for adr in docs/decisions/technical/ADR-[0-9]*.md; do
      #       [ "$adr" = "docs/decisions/technical/ADR-000-template.md" ] && continue
      #       for section in "Status:" "Date:" "## Context" "## Decision" "## Consequences"; do
      #         if ! grep -q "$section" "$adr"; then
      #           echo "❌ $adr missing section: $section"
      #           exit 1
      #         fi
      #       done
      #     done
      #     echo "✅ All ADR files have valid structure"

      # - name: "B2 | No any in DB interfaces (new code only)"
      #   run: |
      #     changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
      #     code_files=$(echo "$changed" | grep -E "src/.*\.(ts|tsx)$" | grep -v node_modules)
      #     if [ -n "$code_files" ]; then
      #       any_violations=$(echo "$code_files" | xargs git diff origin/${{ github.base_ref }}...HEAD -- \
      #         | grep "^+" | grep -E ":\s*any\b" | grep -v "^+++" \
      #         | grep -iE "database|supabase|table|row|record" || true)
      #       if [ -n "$any_violations" ]; then
      #         echo "⚠ Found 'any' type in DB-related new code:"
      #         echo "$any_violations"
      #         echo "Consider explicit typing for database interfaces."
      #       fi
      #     fi
      #     echo "✅ DB interface type check passed"

      # ─────────────────────────────────────────────────
      # NIVEL C — Solo con CI/Claude integración completa
      # ─────────────────────────────────────────────────

      # - name: "C1 | AI coherence check"
      #   env:
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      #   run: |
      #     echo "Nivel C no configurado aún"

      - name: Summary
        if: success()
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "  ✅ AI-Ready validation passed — Level A"
          echo "  L.E.A.N. AI System Enterprise — Alpha Consulting"
          echo "═══════════════════════════════════════════════════"
          echo "  A1 Core files:          ✓"
          echo "  A2 CHANGELOG:           ✓"
          echo "  A3 ADR check:           ✓"
          echo "  A4 PR description:      ✓"
          echo "  A5 Supabase imports:    ✓"
          echo "═══════════════════════════════════════════════════"
