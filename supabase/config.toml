
[functions.ai-recommend]
enabled = true
verify_jwt = false
# JWT validado manualmente en el handler (Paso 1 del flujo de 10 pasos).
# verify_jwt = false permite que la función gestione 401/403 con mensajes
# de error estructurados en lugar de respuestas vacías de la plataforma.
entrypoint = "./functions/ai-recommend/index.ts"

[functions.log-audit-event]
enabled = true
verify_jwt = false
# JWT validado manualmente en el handler para enriquecer el log con user_id/email/role
# extraídos server-side. verify_jwt=false permite devolver errores 401 estructurados.
entrypoint = "./functions/log-audit-event/index.ts"

[functions.invite-user]
enabled = true
verify_jwt = true
import_map = "./functions/invite-user/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/invite-user/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/invite-user/*.html" ]
